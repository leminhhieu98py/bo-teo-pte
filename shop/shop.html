<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bo cố lên Shop</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ui/theme.css">
  <script src="../ui/theme-boot.js"></script>
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <main>
    <div class="head">
      <div class="mascot" id="mascot"></div>
      <div>
        <h1>Shop</h1>
        <p id="subtitle">Spend your money on new friends and colors.</p>
      </div>
      <div class="wallet-box"><span>Wallet</span><b id="wallet">$...</b></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab on" id="tabPets" role="tab" aria-selected="true">Pets</button>
      <button class="tab" id="tabThemes" role="tab" aria-selected="false">Themes</button>
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="status" id="status"></p>
  </main>
  <script type="module" src="shop.js"></script>
</body>
</html>
