<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bo cố lên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ui/theme.css">
  <style>
    body { width: 320px; padding: 18px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .top .mascot { width: 64px; height: 58px; }
    .top p { margin: 2px 0 0; color: var(--ink-soft); font-weight: 700; font-size: 13px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat { background: #fff; border-radius: 18px; padding: 12px; text-align: center; box-shadow: var(--shadow); }
    .stat b { display: block; font-size: 26px; font-weight: 900; color: var(--primary); }
    .stat span { font-size: 12px; font-weight: 800; color: var(--ink-soft); }
    .bar { height: 12px; background: #fff; border-radius: 99px; overflow: hidden; margin: 6px 0 16px; box-shadow: inset 0 0 0 2px var(--line); }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--primary)); border-radius: 99px; transition: width .6s; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .hint { margin-top: 14px; font-size: 13px; color: var(--ink-soft); font-weight: 700; text-align: center; }
    kbd { background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 8px; padding: 1px 6px; font-family: inherit; color: var(--ink); }
  </style>
</head>
<body>
  <div class="top">
    <div class="mascot" id="mascot"></div>
    <div>
      <h2>Bo cố lên</h2>
      <p id="greeting">Ready to learn?</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="streak">0</b><span>day streak</span></div>
    <div class="stat"><b id="xp">0</b><span>XP today</span></div>
  </div>
  <div style="font-weight:800;font-size:14px">Today: <span id="progressText">not started</span></div>
  <div class="bar"><i id="progressBar"></i></div>
  <div class="actions">
    <button class="btn btn-primary" id="start">Start review</button>
    <button class="btn btn-ghost" id="history">History</button>
    <button class="btn btn-ghost" id="settings">Settings</button>
  </div>
  <div class="hint">Save a word: highlight it, then press <kbd id="shortcut">Cmd+B</kbd><br>Nothing highlighted? Press it and drag around the explanation.</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
